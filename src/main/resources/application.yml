spring:
  profiles:
    active: local
  application:
    name: yu-ai-code-father
  # mysql
  datasource:
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yu.yuaifather.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn



