spring:
  profiles:
    active: local
  application:
    name: yu-ai-code-father
  # mysql：敏感信息通过环境变量或 application-local.yml 注入，禁止在此硬编码真实凭据
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yu_ai_code_mother}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      database: ${REDIS_DATABASE:0}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 跨域配置：仅放行可信前端来源，多个用逗号分隔（生产环境务必收敛为真实域名）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yu.yuaifather.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 图片服务配置：所有 API Key 通过环境变量注入，禁止在此明文写入
image:
  unsplash:
    access-key: ${UNSPLASH_ACCESS_KEY:}
    base-url: https://api.unsplash.com
    timeout-ms: 5000
  pexels:
    api-key: ${PEXELS_API_KEY:}
    base-url: https://api.pexels.com/v1
    timeout-ms: 5000
  fallback:
    # 搜图无结果时是否启用文生图兜底（默认关闭，避免额外费用）
    enabled: ${IMAGE_FALLBACK_ENABLED:false}
    picsum-url: https://picsum.photos/seed/{seed}/1200/800
  replace:
    concurrency: 4
    cache-ttl-seconds: 3600

# 多 Agent 编排开关
agent:
  orchestrator:
    # 是否启用多 Agent 流水线（仅 VUE_PROJECT 生效，默认关闭以避免影响存量）
    enabled: ${AGENT_ORCHESTRATOR_ENABLED:false}
  critic:
    # Critic 反馈最大轮次
    max-rounds: 3
  deploy:
    # 是否在流水线末尾自动执行 DeployAgent（构建并上传 COS）
    enabled: ${AGENT_DEPLOY_ENABLED:false}
