# =============================================================================
# CreatAi Nginx 站点配置（2 核 4G 单机版，HTTP/80）
# 安装位置 : /etc/nginx/conf.d/creat-ai.conf
# 安装步骤 :
#   sudo install -m 644 docs/deploy/nginx/creat-ai.conf /etc/nginx/conf.d/creat-ai.conf
#   sudo sed -i 's/CHANGE_ME_HOST/你的域名/g' /etc/nginx/conf.d/creat-ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 前置条件 :
#   - 前端构建产物已上传到 /var/www/creat-ai（frontend/dist/*）
#   - 后端监听 127.0.0.1:8123，context-path 为 /api（见 application.yml）
#   - 安全组/ufw 只放开 22、80；8123 不对外
# 说明 :
#   - 同源部署：前端与 /api 都走 80 端口，浏览器不会跨域
#   - /api/ 反代必须保留原路径前缀（proxy_pass 结尾不加 /），与后端 context-path=/api 对齐
#   - SSE（生成进度）必须关闭缓冲，否则前端会“憋住”直到整个响应结束
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME_HOST;

    # 前端 SPA 根目录
    root /var/www/creat-ai;
    index index.html;

    # 上传/请求体上限，与后端限制保持一致（当前业务无大上传，留 50m 余量）
    client_max_body_size 50m;

    access_log /var/log/nginx/creat-ai.access.log;
    error_log  /var/log/nginx/creat-ai.error.log;

    # --- gzip：前端静态资源压缩，省流量（200M 峰值带宽下收益明显）-------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- 后端 API / SSE / 静态部署产物 -----------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8123;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE 关键配置：关闭缓冲，生成进度实时下发
        proxy_buffering off;
        proxy_cache off;
        # 生成/构建类接口可能跑十几分钟（codegen.build 超时 900s），放宽读超时
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # 让 Nginx 不缓冲 SSE（部分版本需要该响应头）
        add_header X-Accel-Buffering no;
    }

    # 健康检查入口（不暴露到公网时可删除；此处用于本机/探活）
    location = /healthz {
        proxy_pass http://127.0.0.1:8123/api/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- 前端静态资源 -----------------------------------------------------------
    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA 路由：找不到文件时回退 index.html（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁止缓存，保证发版后用户立即拿到新入口
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
