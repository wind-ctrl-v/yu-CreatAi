spring:
  profiles:
    active: local
  application:
    name: yu-ai-code-father
  # mysql：敏感信息通过环境变量或 application-local.yml 注入，禁止在此硬编码真实凭据
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yu_ai_code_mother}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # PGvector 辅助数据源（仅用于向量存储与语义检索，不影响 MySQL 主链路）
  pgvector:
    datasource:
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/yu_ai_vector}
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 5000
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      database: ${REDIS_DATABASE:0}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 跨域配置：仅放行可信前端来源，多个用逗号分隔（生产环境务必收敛为真实域名）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yu.yuaifather.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 可观测性：应用指标暴露（prometheus 等敏感端点由 ActuatorAuthFilter 做管理员鉴权）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# 日志串联：requestId（每请求）/ generationId / appId（生成链路）占位，无 MDC 时输出为空
logging:
  pattern:
    level: "%5p [requestId=%X{requestId}] [generationId=%X{generationId}] [appId=%X{appId}]"

# LangChain4j OpenAI 兼容客户端：超时等非密钥项可在此覆盖。
# api-key / base-url / model-name 仍由 application-local.yml 或环境变量提供。
# 同步 ChatModel 默认超时仅 15s，不足以支撑 V2 规划 / 质检；流式同理加长。
langchain4j:
  open-ai:
    chat-model:
      timeout: ${LANGCHAIN4J_CHAT_MODEL_TIMEOUT:300s}
      max-retries: ${LANGCHAIN4J_CHAT_MODEL_MAX_RETRIES:2}
    streaming-chat-model:
      timeout: ${LANGCHAIN4J_STREAMING_CHAT_MODEL_TIMEOUT:300s}


# 图片服务配置：所有 API Key 通过环境变量注入，禁止在此明文写入
image:
  # 首选搜图源：Pixabay（国内访问友好，key 作为 URL 查询参数）
  pixabay:
    api-key: ${PIXABAY_API_KEY:}
    base-url: https://pixabay.com/api
    timeout-ms: 5000
  unsplash:
    access-key: ${UNSPLASH_ACCESS_KEY:}
    base-url: https://api.unsplash.com
    timeout-ms: 5000
  pexels:
    api-key: ${PEXELS_API_KEY:}
    base-url: https://api.pexels.com/v1
    timeout-ms: 5000
  fallback:
    # 搜图无结果时是否启用文生图兜底（默认关闭，避免额外费用）
    enabled: ${IMAGE_FALLBACK_ENABLED:false}
    picsum-url: https://picsum.photos/seed/{seed}/1200/800
    # 文生图兜底（OpenAI 兼容 /images/generations），仅 enabled=true 且配置 api-key 时生效
    base-url: ${IMAGE_TEXT2IMG_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${IMAGE_TEXT2IMG_API_KEY:}
    model: ${IMAGE_TEXT2IMG_MODEL:cogview-3-flash}
    size: 1024x1024
    timeout-ms: 30000
    max-bytes: 20971520
  replace:
    concurrency: 4
    cache-ttl-seconds: 3600

# 应用部署基础 URL（生产环境通过环境变量 APP_DEPLOY_BASE_URL 覆盖为真实域名）
app:
  deploy:
    base-url: ${APP_DEPLOY_BASE_URL:http://localhost:8123/api/static}
  # 截图（headless Chrome）配置：2C4G 单机部署时使用显式路径 + 单线程执行
  screenshot:
    chrome-binary: ${APP_SCREENSHOT_CHROME_BINARY:}
    driver-path: ${APP_SCREENSHOT_DRIVER_PATH:}
    use-web-driver-manager: ${APP_SCREENSHOT_USE_WDM:true}
    executor:
      core-pool-size: ${APP_SCREENSHOT_EXECUTOR_CORE:2}
      max-pool-size: ${APP_SCREENSHOT_EXECUTOR_MAX:4}
      queue-capacity: ${APP_SCREENSHOT_EXECUTOR_QUEUE:20}
  # 并发保护：0 = 不限制（默认保持旧行为）
  limits:
    generation:
      max-concurrent: ${APP_LIMITS_GENERATION_MAX_CONCURRENT:0}
    deploy:
      max-concurrent: ${APP_LIMITS_DEPLOY_MAX_CONCURRENT:0}

# 代码生成 / 静态资源根目录（StaticResourceController、文生图与封面截图共用；
# 默认与 AppConstant.CODE_OUTPUT_ROOT_DIR 一致。封面访问路径为 /api/static/_generated_images/...）
code:
  output-root-dir: ${CODE_OUTPUT_ROOT_DIR:${user.dir}/tmp/code_output}

# Vue 项目构建配置（串行锁 / 超时 / 构建后清理），默认值与改造前一致
codegen:
  build:
    lock-wait-seconds: ${CODEGEN_BUILD_LOCK_WAIT_SECONDS:300}
    install-timeout-seconds: ${CODEGEN_BUILD_INSTALL_TIMEOUT_SECONDS:300}
    build-timeout-seconds: ${CODEGEN_BUILD_TIMEOUT_SECONDS:180}
    cleanup-node-modules: ${CODEGEN_BUILD_CLEANUP_NODE_MODULES:false}

# 多 Agent 编排开关
agent:
  # 用户设计偏好与项目品牌画像默认参与生成，可通过环境变量独立关闭
  personalization:
    enabled: ${AGENT_PERSONALIZATION_ENABLED:true}
  rerank:
    enabled: ${AGENT_RERANK_ENABLED:true}
  orchestrator:
    # V2 多 Agent 流水线唯一开关（仅 VUE_PROJECT 生效，默认关闭）
    v2:
      enabled: ${AGENT_ORCHESTRATOR_V2_ENABLED:false}
  critic:
    # Critic 反馈最大轮次
    max-rounds: 3
  deploy:
    # 是否在 V2 流水线末尾执行 DeployTool（构建并上传 COS）。
    # 生成完成后的本地部署（deployKey、封面截图）不读取此开关，始终调用 AppService.deployApp。
    enabled: ${AGENT_DEPLOY_ENABLED:false}
  # 指纹爬取（覆盖度优化 阶段三）
  fingerprint:
    # 外部种子页面爬取：从配置的优秀设计站点抓取并提炼指纹，打破内部自复制闭环，默认关闭
    external-crawl:
      enabled: ${AGENT_FINGERPRINT_EXTERNAL_CRAWL_ENABLED:false}
      interval-ms: ${AGENT_FINGERPRINT_EXTERNAL_CRAWL_INTERVAL_MS:86400000}
      urls: ${AGENT_FINGERPRINT_EXTERNAL_CRAWL_URLS:}
      render-enabled: ${AGENT_FINGERPRINT_EXTERNAL_CRAWL_RENDER_ENABLED:true}
      request-interval-ms: ${AGENT_FINGERPRINT_EXTERNAL_CRAWL_REQUEST_INTERVAL_MS:5000}
  # 阶段三：运行时召回（默认关闭，启用需 design_fingerprint 表就绪；关闭时仅用阶段一静态规范）
  retrieve:
    enabled: ${AGENT_RETRIEVE_ENABLED:false}
    # 召回 top-k（最大不超过 3）
    top-k: ${AGENT_RETRIEVE_TOP_K:2}
    # 3B 向量检索独立开关（基于 PGvector；关闭或失败自动回退 3A 结构检索）
    vector:
      enabled: ${AGENT_RETRIEVE_VECTOR_ENABLED:false}
      min-similarity: ${AGENT_RETRIEVE_VECTOR_MIN_SIMILARITY:0.7}
      # 向量后端：pg（默认，兼容旧行为）/ mysql（2C4G 单机推荐，无需 PostgreSQL）
      store: ${AGENT_RETRIEVE_VECTOR_STORE:pg}
      # mysql 后端内存快照定时重载间隔（毫秒），0=关闭定时重载
      reload-interval-ms: ${AGENT_RETRIEVE_VECTOR_RELOAD_MS:300000}
      # 期望向量维度，0=自动探测（智谱 embedding-2 为 1024）
      expected-dim: ${AGENT_RETRIEVE_VECTOR_EXPECTED_DIM:0}
      # mysql 后端内存快照最大条目数，超出只加载优先级最高的部分（防 OOM）
      max-entries: ${AGENT_RETRIEVE_VECTOR_MAX_ENTRIES:20000}
      # 管理员一次性重同步向量的单次上限
      resync-max: ${AGENT_RETRIEVE_VECTOR_RESYNC_MAX:100}
    # 动态合成兜底（覆盖度优化 阶段二）：检索 miss 达阈值时 LLM 现场合成设计规范，
    # 产物入库 CANDIDATE 待人工审核；默认关闭
    synth:
      enabled: ${AGENT_RETRIEVE_SYNTH_ENABLED:false}
      miss-threshold: ${AGENT_RETRIEVE_SYNTH_MISS_THRESHOLD:2}
  # 对话记忆治理：JVM 内存窗口存全文（模型上下文的事实源）+ 渲染时分层压缩 + 字符预算裁剪；
  # Redis 只保存压缩快照作备份，不回读、不进入模型上下文；跨请求恢复走 MySQL 冷加载
  memory:
    # JVM 内存窗口最大消息条数（内存存全文，不可沿用压缩形态下的大值）
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:60}
    # 冷启动从 MySQL 加载的历史条数（跳过最新 1 条本轮用户消息）
    load-count: 20
    # 发给模型时保持全文的最近轮次数（以 UserMessage 为轮次边界，保证本轮 readFile/writeFile 内容真实）
    full-text-turns: ${AGENT_MEMORY_FULL_TEXT_TURNS:2}
    # 全文段条数兜底上限，防止单轮工具消息过多把预算吃光
    full-text-max-messages: ${AGENT_MEMORY_FULL_TEXT_MAX_MESSAGES:24}
    # 上下文字符预算，超出则从最早消息开始丢弃。混合内容保守按 2 字符/token 折算，
    # 80000 ≈ 40K token，为 64K 上下文窗口与 8192 输出预留余量
    char-budget: ${AGENT_MEMORY_CHAR_BUDGET:80000}
    # 单条消息入内存前的硬截断上限，防止一次超大工具结果顶爆窗口
    hard-max-message-chars: ${AGENT_MEMORY_HARD_MAX_MESSAGE_CHARS:200000}
    # 每累积多少条消息向 Redis 落一次压缩快照（快照仅为备份）
    snapshot-every: ${AGENT_MEMORY_SNAPSHOT_EVERY:5}
    compress:
      # 单条消息超过该字符数才触发压缩，短消息原样保留
      threshold: 1500
      # 代码块外解释文字保留的最大字符数
      explain-max-chars: 500

# 生成体系：链路 / 模式 / 套餐。由 GenerationModeResolver 消费产出 GenerationPolicy。
# 未配置项由 GenerationProperties 内置默认值兜底；model 键暂未被编排器消费（后续接入）。
generation:
  # 默认生成模式（兼容入口 GenerationOrchestrator.generate(ctx) 使用）
  mode: ${GENERATION_MODE:standard}
  pipeline:
    preferred: V2
    allow-classic-fallback: true
  modes:
    low_cost:
      enable-coder-style-parallel: false
      enable-llm-critic: false
      critic-trigger: never
      max-critic-rounds: 0
      max-evidence-count: 1
      timeout-ms: 180000
    standard:
      enable-coder-style-parallel: true
      enable-llm-critic: true
      critic-trigger: on_rule_failure
      max-critic-rounds: 1
      max-evidence-count: 3
      timeout-ms: 300000
    high_quality:
      enable-coder-style-parallel: true
      enable-llm-critic: true
      critic-trigger: always
      max-critic-rounds: 3
      max-evidence-count: 5
      timeout-ms: 600000
  entitlements:
    FREE:
      default-mode: low_cost
      max-mode: low_cost
      daily-low-cost-limit: 10
    PRO:
      default-mode: standard
      max-mode: standard
      daily-standard-limit: 50
    PREMIUM:
      default-mode: standard
      max-mode: high_quality
      daily-standard-limit: 100
      daily-high-quality-limit: 10
    ENTERPRISE:
      default-mode: high_quality
      max-mode: high_quality
      daily-high-quality-limit: 100
    ADMIN:
      default-mode: high_quality
      max-mode: high_quality

# 设计指纹提炼（阶段二，离线）
design:
  extractor:
    # 截图视觉模型解析开关，默认关闭（仅走 HTML 摘要路径，零额外依赖）
    vision-enabled: ${DESIGN_EXTRACTOR_VISION_ENABLED:false}
