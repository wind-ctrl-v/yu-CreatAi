spring:
  profiles:
    active: local
  application:
    name: yu-ai-code-father
  # mysql：敏感信息通过环境变量或 application-local.yml 注入，禁止在此硬编码真实凭据
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yu_ai_code_mother}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # PGvector 辅助数据源（仅用于向量存储与语义检索，不影响 MySQL 主链路）
  pgvector:
    datasource:
      url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5432/yu_ai_vector}
      username: ${PGVECTOR_USERNAME:postgres}
      password: ${PGVECTOR_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 5000
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      database: ${REDIS_DATABASE:0}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 跨域配置：仅放行可信前端来源，多个用逗号分隔（生产环境务必收敛为真实域名）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yu.yuaifather.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 图片服务配置：所有 API Key 通过环境变量注入，禁止在此明文写入
image:
  unsplash:
    access-key: ${UNSPLASH_ACCESS_KEY:}
    base-url: https://api.unsplash.com
    timeout-ms: 5000
  pexels:
    api-key: ${PEXELS_API_KEY:}
    base-url: https://api.pexels.com/v1
    timeout-ms: 5000
  fallback:
    # 搜图无结果时是否启用文生图兜底（默认关闭，避免额外费用）
    enabled: ${IMAGE_FALLBACK_ENABLED:false}
    picsum-url: https://picsum.photos/seed/{seed}/1200/800
  replace:
    concurrency: 4
    cache-ttl-seconds: 3600

# 应用部署基础 URL（生产环境通过环境变量 APP_DEPLOY_BASE_URL 覆盖为真实域名）
app:
  deploy:
    base-url: ${APP_DEPLOY_BASE_URL:http://localhost:8123/api/static}

# 多 Agent 编排开关
agent:
  orchestrator:
    # 是否启用多 Agent 流水线（仅 VUE_PROJECT 生效，默认关闭以避免影响存量）
    enabled: ${AGENT_ORCHESTRATOR_ENABLED:false}
  critic:
    # Critic 反馈最大轮次
    max-rounds: 3
  deploy:
    # 是否在流水线末尾自动执行 DeployAgent（构建并上传 COS）
    enabled: ${AGENT_DEPLOY_ENABLED:false}
  # 阶段三：运行时召回（默认关闭，启用需 design_fingerprint 表就绪；关闭时仅用阶段一静态规范）
  retrieve:
    enabled: ${AGENT_RETRIEVE_ENABLED:false}
    # 召回 top-k（最大不超过 3）
    top-k: ${AGENT_RETRIEVE_TOP_K:2}
    # 3B 向量检索独立开关（基于 PGvector；关闭或失败自动回退 3A 结构检索）
    vector:
      enabled: ${AGENT_RETRIEVE_VECTOR_ENABLED:false}
      min-similarity: ${AGENT_RETRIEVE_VECTOR_MIN_SIMILARITY:0.7}

# 设计指纹提炼（阶段二，离线）
design:
  extractor:
    # 截图视觉模型解析开关，默认关闭（仅走 HTML 摘要路径，零额外依赖）
    vision-enabled: ${DESIGN_EXTRACTOR_VISION_ENABLED:false}
